
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MatchFlow.AI - Quebre o Gelo com Inteligência</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0E1117;
        color: #f8fafc;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      .animate-in {
        animation-duration: 600ms;
        animation-fill-mode: both;
      }
      
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      
      @keyframes slide-in-from-top {
        from { transform: translateY(-20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }

      @keyframes slide-in-from-bottom {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      
      @keyframes zoom-in {
        from { transform: scale(0.95); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      
      .fade-in { animation-name: fade-in; }
      .slide-in-from-top-4 { animation-name: slide-in-from-top; }
      .slide-in-from-bottom-4 { animation-name: slide-in-from-bottom; }
      .slide-in-from-bottom-6 { animation-name: slide-in-from-bottom; animation-delay: 100ms; }
      .slide-in-from-bottom-8 { animation-name: slide-in-from-bottom; animation-delay: 200ms; }
      .zoom-in-95 { animation-name: zoom-in; }
    </style>
